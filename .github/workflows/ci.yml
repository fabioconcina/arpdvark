name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Build
        run: go build -v ./...

      # Release binaries also ship for linux/arm64 (Raspberry Pi); a cross
      # build catches anything that only breaks there.
      - name: Build (linux/arm64)
        env:
          GOARCH: arm64
        run: go build ./...

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Vet
        run: go vet ./...
